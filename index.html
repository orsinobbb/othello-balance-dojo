<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f3d31">
  <title>黑白棋平衡道場｜逐手教學</title>
  <link rel="stylesheet" href="./styles.css?v=3">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">EXACT E20 → TERMINAL</p>
        <h1>黑白棋平衡道場</h1>
        <p>黑白雙方都由你操作。每一手先讀空格、縮小候選、找節奏，再用完整搜尋證明。</p>
      </div>
      <div class="evidence" id="evidence">資料驗證中…</div>
    </header>

    <nav class="question-bar" aria-label="題目選擇">
      <label for="root-select">目前題目</label>
      <select id="root-select" disabled><option>載入中…</option></select>
      <span>第 1 題就是 C1 搶手數、看似送角的範例。</span>
    </nav>

    <section class="workspace" aria-live="polite">
      <div class="board-panel">
        <div class="status-row"><span id="turn">載入中</span><span id="position-meta">—</span></div>
        <div class="board-wrap">
          <div class="coordinates" aria-hidden="true"><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span></div>
          <div id="board" class="board" role="grid" aria-label="黑白棋盤"></div>
        </div>
        <p class="board-note">白點是合法落點；候選與精算答案只會在對應教學步驟顯示。</p>
      </div>

      <aside class="coach-panel">
        <div class="score-strip">
          <div><b id="black-count">0</b><span>黑</span></div>
          <div><b id="empty-count">20</b><span>空格</span></div>
          <div><b id="white-count">0</b><span>白</span></div>
        </div>

        <div class="lesson-progress" aria-label="教學進度">
          <span data-lesson-step="0">1 讀區域</span>
          <span data-lesson-step="1">2 篩候選</span>
          <span data-lesson-step="2">3 找節奏</span>
          <span data-lesson-step="3">4 精算證明</span>
        </div>

        <div id="last-result" class="last-result" hidden></div>
        <section class="coach-card">
          <p class="label" id="lesson-step">逐手教學</p>
          <h2 id="lesson-title">準備棋局</h2>
          <div id="lesson-body" class="lesson-body"><p>正在驗證精算資料。</p></div>
        </section>

        <div class="actions">
          <button id="analysis-next" class="primary" type="button">下一步</button>
          <button id="reveal" type="button">直接看精算結果</button>
          <button id="retry" class="primary" type="button" hidden>重試這一手</button>
          <button id="next" class="primary" type="button" hidden>下一題</button>
          <button id="replay" type="button" hidden>重播棋譜</button>
        </div>

        <section><p class="label">雙方自弈棋譜</p><ol id="history" class="history"><li>尚未落子</li></ol></section>
      </aside>
    </section>
    <p id="fatal" class="fatal" hidden></p>
  </main>
  <script type="module" src="./src/app.js?v=3"></script>
</body>
</html>
